<!DOCTYPE html>
<html lang="it" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Barbiere – Prenota il tuo appuntamento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="pole" aria-hidden="true"></div>
<div class="w">

  <div class="lang" role="group" aria-label="Language / Lingua / اللغة">
    <button type="button" data-lang="en" lang="en" aria-label="English">EN</button>
    <button type="button" data-lang="it" lang="it" aria-label="Italiano">IT</button>
    <button type="button" data-lang="ar" lang="ar" aria-label="العربية">عربي</button>
  </div>

  <header class="hero">
    <h1>✂ BARBER SHOP</h1>
    <p class="sub" data-i18n="sub">Prenota il tuo appuntamento in pochi secondi</p>
  </header>

  <section class="step">
    <span class="num" aria-hidden="true">1</span>
    <h2 id="h-srv" data-i18n="s1">Servizio</h2>
    <div class="opts" id="srv" role="group" aria-labelledby="h-srv"></div>
  </section>

  <section class="step">
    <span class="num" aria-hidden="true">2</span>
    <h2 id="h-day" data-i18n="s2">Giorno</h2>
    <input type="date" id="day" aria-labelledby="h-day">
  </section>

  <section class="step">
    <span class="num" aria-hidden="true">3</span>
    <h2 id="h-time" data-i18n="s3">Orario</h2>
    <div class="slots" id="slots" role="group" aria-labelledby="h-time"></div>
    <p class="note" id="closedNote" hidden></p>
  </section>

  <section class="step">
    <span class="num" aria-hidden="true">4</span>
    <h2 data-i18n="s4">I tuoi dati</h2>
    <label for="nm" data-i18n="lbName">Nome e cognome</label>
    <input id="nm" autocomplete="name">
    <label for="tel" data-i18n="lbTel">Telefono</label>
    <input id="tel" type="tel" autocomplete="tel">
  </section>

  <div id="err" role="status" aria-live="polite"></div>
  <button type="button" class="go" id="send" data-i18n="book">Prenota</button>

  <p class="info">
    <span data-i18n="addr">Via Colonna Rotta, Palermo · Lun–Sab 9:00–19:00 · Domenica chiuso</span><br>
    <span data-i18n="conf">Riceverai conferma via WhatsApp.</span>
  </p>
</div>
<script src="script.js"></script>
</body>
</html>
